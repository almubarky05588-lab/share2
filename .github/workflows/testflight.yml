name: TestFlight

on:
  workflow_dispatch:

jobs:
  beta:
    name: بناء ورفع إلى TestFlight
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: اختيار أحدث Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26* | sort -V | tail -1)/Contents/Developer" && xcodebuild -version

      - name: فحص توكن مستودع الشهادات
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$MATCH_GIT_TOKEN" | tr -d '[:space:]')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/almubarky05588-lab/share-certs)
          echo "استجابة GitHub API: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "❌ التوكن لا يصل للمستودع"
            exit 1
          fi
          echo "✅ التوكن سليم"

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: رفع رقم البناء
        run: |
          BUILD=$(( 100 + ${{ github.run_number }} ))
          echo "رقم البناء الجديد: $BUILD"
          sed -i '' -E "s/^version: (.*)\+.*/version: \1+$BUILD/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: جلب الحزم
        run: flutter pub get

      - name: فحص الأخطاء البرمجية فقط
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || {
            echo "⚠️ توجد تحذيرات — نكمل البناء"
          }

      - name: تجهيز ملفات Flutter لـ iOS
        run: |
          flutter build ios --release --no-codesign 2>&1 | tail -60 || {
            echo "❌ فشل التجهيز — راجع الأسطر أعلاه"
            exit 1
          }

      - name: تثبيت Ruby و fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: تثبيت fastlane
        run: gem install fastlane --no-document

      - name: الرفع إلى TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
        run: |
          TOKEN=$(printf '%s' "$MATCH_GIT_TOKEN" | tr -d '[:space:]')
          MATCH_GIT_BASIC_AUTHORIZATION=$(printf '%s' "x-access-token:$TOKEN" | base64 | tr -d '[:space:]')
          export MATCH_GIT_BASIC_AUTHORIZATION
          fastlane beta

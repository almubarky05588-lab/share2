name: Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    name: تحليل وبناء
    runs-on: macos-14

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد مجلدات المنصات إن لم تكن موجودة
        run: |
          if [ ! -d "ios" ]; then
            flutter create \
              --project-name share_app \
              --org sa.almubarky \
              --platforms=ios,android \
              .
          fi

      - name: جلب الحزم
        run: flutter pub get

      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos

      - name: بناء iOS بدون توقيع
        run: flutter build ios --release --no-codesign

      - name: رفع مجلدات المنصات المولّدة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-folders
          path: |
            ios/
            android/
          retention-days: 7

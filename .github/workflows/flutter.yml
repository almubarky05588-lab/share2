name: Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: تحليل وبناء
    runs-on: macos-14

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد مجلدات المنصات إن لم تكن موجودة
        id: gen
        run: |
          if [ ! -d "ios" ]; then
            flutter create \
              --project-name share_app \
              --org sa.almubarky \
              --platforms=ios,android \
              .
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: إزالة الملفات المولّدة غير المطلوبة
        run: |
          rm -f test/widget_test.dart
          rm -rf .idea
          rm -f share_app.iml android/share_app_android.iml

      - name: حفظ مجلدي ios و android في المستودع
        if: steps.gen.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ios android analysis_options.yaml .gitignore
          git commit -m "إضافة مجلدي ios و android المولّدين"
          git push

      - name: جلب الحزم
        run: flutter pub get

      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos

      - name: بناء iOS بدون توقيع
        run: flutter build ios --release --no-codesign
